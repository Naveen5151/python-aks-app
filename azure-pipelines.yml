trigger:
- main
- develop

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'FlaskApp Build'

  jobs:
  - job: Code_Validation
    displayName: 'Initial Validation'

    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.13'
      displayName: 'Setup Python'

    - script: |
        echo "##vso[task.setvariable variable=PIP_CACHE_DIR]$(pip cache dir)"
        echo "Working directory:"
        pwd
        ls -la
      displayName: 'Set pip cache directory'

    - task: Cache@2
      displayName: 'Restore pip cache'
      inputs:
        key: 'pip | "$(Agent.OS)" | requirements.txt'
        restoreKeys: |
          pip | "$(Agent.OS)"
        path: $(PIP_CACHE_DIR)

    - script: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install flake8 pytest pytest-cov bandit
      displayName: 'Install Dependencies'

    - script: |
        echo "Pipeline HEAD:"
        git rev-parse HEAD

        echo "Build SourceVersion:"
        echo "$(Build.SourceVersion)"

        echo "Build SourceBranch:"
        echo "$(Build.SourceBranch)"

        echo "Latest commits:"
        git log --oneline -5

        echo "user.py received by pipeline:"
        nl -ba models/user.py
      displayName: 'Verify Git Checkout'

    - script: |
        python -m flake8 . --exclude=.git,__pycache__,venv,.venv,instance
      displayName: 'Lint - Flake8'

    - script: |
        python -m pytest \
          --cov=. \
          --cov-report=term \
          --cov-report=xml:coverage.xml
      displayName: 'Unit Tests and Code Coverage'

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
      displayName: 'Publish Code Coverage'

    - script: |
        python -m bandit -r . -x ./tests,./instance
      displayName: 'Security Scan - Bandit'