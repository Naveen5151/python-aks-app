trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'FlaskApp Build'

  jobs:
  - job: 'Code_Validation'
    displayName: 'InitialValidation'

    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.13'
      displayName:  'Setup Python'

    - script: |
        echo "##vso[task.setvariable variable=PIP_CACHE_DIR]$(pip cache dir)"
        pwd
        ls
      displayName: 'Set pip cache directory'

    - task: Cache@2
      displayName: 'Restore pip cache'
      inputs:
        key: 'pip | "$(Agent.OS)" | requiremet.txt'
        restoreKey: $(PIP_CACHE_DIR)

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      workingDirectory: '$(Build.SourcesDirectory)/python-aks-app'  
      displayName: 'Install Dependencies'

