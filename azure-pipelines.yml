trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'FlaskApp Build'

  jobs:
  - job: 'Code_Validation'
    displayName: 'InitialValidation'

    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.13'
      displayName:  'Setup Python'

    - script: |
        echo "##vso[task.setvariable variable=PIP_CACHE_DIR]$(pip cache dir)"
        pwd
        ls
        echo "$(Build.SourcesDirectory)"
      displayName: 'Set pip cache directory'

    - task: Cache@2
      displayName: 'Restore pip cache'
      inputs:
        key: 'pip | "$(Agent.OS)" | requirements.txt'
        restoreKey: $(PIP_CACHE_DIR)

    - script: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pytest pytest-cov bandit
     # workingDirectory: '$(Build.SourcesDirectory)'  
      displayName: 'Install Dependencies'

    - script: |
        echo "File received by pipeline:"
        nl -ba models/user.py

        echo "Running Flake8:"
        python -m flake8 models/user.py
      displayName: 'Check user.py'

    - script: |
        flake8 . --exclude=.git,__pycache__,venv,.venv,instance
      displayName: 'Lint - Flake8'

    - script: |
        pytest --cov=. --cov-report=term --cov-report=xml:coverage.xml
      displayName: 'Unit Tests and Code Coverage'

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
      displayName: 'Publish Code Coverage'

