trigger:
- main
- develop

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  displayName: 'FlaskApp Build'

  jobs:
  - job: Code_Validation
    displayName: 'Initial Validation'

    steps:
    - checkout: self
      clean: true
      fetchDepth: 0

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.13'
      displayName: 'Setup Python'

    - script: |
        echo "##vso[task.setvariable variable=PIP_CACHE_DIR]$(pip cache dir)"
        echo "Working directory:"
        pwd
        ls -la
      displayName: 'Set pip cache directory'

    - task: Cache@2
      displayName: 'Restore pip cache'
      inputs:
        key: 'pip | "$(Agent.OS)" | requirements.txt'
        restoreKeys: |
          pip | "$(Agent.OS)"
        path: $(PIP_CACHE_DIR)

    - script: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade -r requirements.txt
        python -m pip install flake8 pytest pytest-cov bandit
      displayName: 'Install Dependencies'


    #- script: |
      # python -m flake8 . --exclude=.git,__pycache__,venv,.venv,instance
     # displayName: 'Lint - Flake8'

    - script: |
        python -m pytest \
          --cov=. \
          --cov-report=term \
          --cov-report=xml:coverage.xml
      displayName: 'Unit Tests and Code Coverage'

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
      displayName: 'Publish Code Coverage'

    #- script: |
     #   python -m bandit -r . -x ./tests,./instance
      #displayName: 'Security Scan - Bandit'

- stage:
  displayName: 'Docker Build'

  jobs:
  - job:
    displayName: 'Build Image'

    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        containerRegistry: 'Docker connection'
        repository: 'naveens51/flask-app-aks'
        command: 'build'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(Build.BuildId)
        arguments: '--pull --no-cache'
    
    - script: |
        docker images | grep  flask-app-aks
        docker run --rm naveens51/flask-app-aks:$(Build.BuildId) pip list | grep -Ei "msgpack|urllib3|setuptools"
      displayName: Verify image contents (temporary)

    # 2. Install Trivy
    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
          | sudo sh -s -- -b /usr/local/bin

        trivy --version
      displayName: 'Install Trivy'

    - script: |
        trivy image --debug \
          --severity HIGH,CRITICAL \
          --exit-code 1 \
          naveens51/flask-app-aks:$(Build.BuildId)
      displayName: 'Trivy Security Scan'

    # 3. Push only if Trivy succeeds
    - task: Docker@2
      displayName: 'Push Docker Image'
      inputs:
        containerRegistry: 'Docker connection'
        repository: 'naveens51/flask-app-aks'
        command: 'push'
        tags: |

