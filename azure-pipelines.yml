trigger:
- main
- develop

pool:
  vmImage: 'ubuntu 26'

stages:
- stage: 'Test'
  displayName: 'FlaskApp Test'

  jobs:
  - job: Code_Validation
    displayName: 'Initial Validation'

    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.13'
      displayName: 'Setup Python'

    - script: |
        echo "##vso[task.setvariable variable=PIP_CACHE_DIR]$(pip cache dir)"
      displayName: 'Set pip cache directory'

    - task: Cache@2
      displayName: 'Restore pip cache'
      inputs:
        key: 'pip | "$(Agent.OS)" | requirements.txt'
        restoreKeys: |
          pip | "$(Agent.OS)"
        path: $(PIP_CACHE_DIR)

    - script: |
        python -m pip install --upgrade pip
        python -m pip install --upgrade -r requirements.txt
        python -m pip install flake8 pytest pytest-cov bandit
      displayName: 'Install Dependencies'


    #- script: |
      # python -m flake8 . --exclude=.git,__pycache__,venv,.venv,instance
     # displayName: 'Lint - Flake8'

    - script: |
        python -m pytest \
          --cov=. \
          --cov-report=term \
          --cov-report=xml:coverage.xml
      displayName: 'Unit Tests and Code Coverage'

    - task: PublishCodeCoverageResults@2
      inputs:
        summaryFileLocation: '$(System.DefaultWorkingDirectory)/coverage.xml'
      displayName: 'Publish Code Coverage'

- stage:
  dependsOn: 'Test'
  condition: succeeded()
  displayName: 'Docker Build'

  jobs:
  - job:
    displayName: 'Build Image'

    steps:
    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        containerRegistry: 'Docker connection'
        repository: 'naveens51/flask-app-aks'
        command: 'build'
        Dockerfile: '$(Build.SourcesDirectory)/Dockerfile'
        tags: |
          $(Build.BuildId)
        arguments: '--pull --no-cache'
    
    - task: trivy@2
      displayName: 'Trivy Image Scan'
      inputs:
        type: 'image'
        target: 'naveens51/flask-app-aks:$(Build.BuildId)'
        scanners: 'vuln'
        severities: 'HIGH,CRITICAL'
        failOnSeverityThreshold: 'HIGH'
        reports: 'html,junit'
        publish: true

    # 3. Push only if Trivy succeeds
    - task: Docker@2
      displayName: 'Push Docker Image'
      inputs:
        containerRegistry: 'Docker connection'
        repository: 'naveens51/flask-app-aks'
        command: 'push'
        tags: |
          $(Build.BuildId)

